# Intégration continue : toute PR vers main doit être verte avant fusion.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  quality:
    name: Lint et types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: ruff (PEP 8, docstrings Google)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy strict
        run: uv run mypy .
      - name: Migrations à jour
        run: uv run python manage.py makemigrations --check --dry-run

  tests:
    name: Tests et couverture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dream
          POSTGRES_PASSWORD: dream
          POSTGRES_DB: dream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dream" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://dream:dream@localhost:5432/dream
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: ffmpeg (conversion et mesure des enregistrements, comme dans l'image Docker)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: pytest (PostgreSQL)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=json --cov-report=xml --cov-fail-under=70
      - name: Seuil de 70 % par fonctionnalité critique
        run: uv run python scripts/check_coverage.py coverage.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture
          path: |
            coverage.json
            coverage.xml

  docker:
    name: Image Docker et test de fumée
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire et démarrer web + worker + PostgreSQL
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Test de fumée (/health, page de connexion, statiques)
        run: |
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status": "ok"'
          curl -fsS http://localhost:8000/comptes/connexion/ | grep -q "Connexion"
          css=$(curl -fsS http://localhost:8000/comptes/connexion/ | grep -o '/static/css/tailwind[^"]*\.css' | head -1)
          curl -fsS "http://localhost:8000${css}" -o /dev/null
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color

  deploy:
    name: Déploiement Render
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Déclencher le déploiement du commit testé
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL absent : déploiement ignoré."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" -o /dev/null
      - name: Test de fumée en production
        if: env.PROD_URL != ''
        run: |
          # Build Docker + démarrage + réveil de l'instance gratuite : jusqu'à ~10 min.
          for i in $(seq 1 60); do
            if curl -fsS "$PROD_URL/health" | grep -q '"status": "ok"'; then echo "Production OK"; exit 0; fi
            sleep 10
          done
          echo "::error::/health ne répond pas en production"; exit 1
