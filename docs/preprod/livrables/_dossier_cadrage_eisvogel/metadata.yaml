# pas ce compteur (le template par défaut de pandoc, si). Exposants Unicode absents de Pagella → \textsuperscript.
header-includes:
  - |
    ```{=latex}
    \makeatletter\@ifundefined{c@none}{\newcounter{none}}{}\makeatother
    \usepackage{newunicodechar}
    \newunicodechar{ᴱ}{\textsuperscript{E}}
    \newunicodechar{ᵉ}{\textsuperscript{e}}
    \newunicodechar{ʳ}{\textsuperscript{r}}
    ```
