# Registre des risques — source unique (matrice et tableau générés par tools/risks.py).
# probabilite / impact : 1 faible · 2 moyen · 3 élevé · 4 très élevé ; criticité = P × I.
# Rôles (travail individuel, une personne) : PO, Dev, DPO.

[[risk]]
id = "R-01"
category = "Technique"
title = "Latence fournisseurs au-delà des SLO"
probability = 3
impact = 3
trigger = "p95 bout-en-bout > 30 s sur la campagne live ou 1 h de production"
prevention = "Budgets par étape (ADR-006), traitement asynchrone, mesure live dès le Sprint 1"
correction = "Bascule FLUX.2 [klein] ↔ repli, affichage progressif (transcription avant image)"
owner = "Dev"
stories = ["US-08"]

[[risk]]
id = "R-02"
category = "Technique"
title = "Transcription médiocre des voix ensommeillées"
probability = 3
impact = 3
trigger = "WER corpus > 10 % ou > 20 % de transcriptions corrigées en bêta"
prevention = "Corpus incluant voix basse, WER mesuré (K3), correction manuelle (US-05)"
correction = "Voxtral Small (ADR-002), invite contextuelle, faster-whisper large-v3"
owner = "Dev"
stories = ["US-04", "US-05"]

[[risk]]
