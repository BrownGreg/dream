# Source unique du backlog (règle « un fait, un endroit »).
# Génère : docs/cadrage/_gen/story_map.md, tests/features/*.feature,
#          docs/annexes/jira_import.csv, docs/annexes/tracabilite.csv
# via `python tools/backlog.py`.
#
# kano  : B = basique · P = performance · E = enthousiasmante · I = indifférente · R = inverse
# moscow: Must · Should · Could · Won't   — règle : kano = B ⇒ moscow ∈ {Must, Should}
# points: Fibonacci (1, 2, 3, 5, 8, 13)

[[activity]]
id = "A1"
name = "Raconter mon rêve"
[[activity]]
id = "A2"
name = "Comprendre mon rêve"
[[activity]]
id = "A3"
name = "Voir et entendre mon rêve"
[[activity]]
id = "A4"
name = "Retrouver mes rêves"
[[activity]]
id = "A5"
name = "Garder le contrôle"

# ---------------------------------------------------------------- A1
[[story]]
id = "US-01"
activity = "A1"
task = "Enregistrer"
role = "rêveuse au réveil"
want = "enregistrer mon rêve au micro en un seul geste"
so_that = "le capturer avant qu'il ne s'efface"
kano = "B"
moscow = "Must"
points = 3
release = "MVP"
persona = "Léa"
requirements = ["EXF-01", "ENF-04"]
gherkin = """
Scénario: Enregistrement micro valide
  Étant donné que j'ai accepté le consentement
  Quand j'enregistre un récit de 45 secondes au micro
  Alors l'audio est accepté pour traitement

Scénario: Enregistrement trop court
  Étant donné que j'ai accepté le consentement
  Quand j'enregistre un récit de 1 seconde au micro
  Alors je vois le message « Enregistrement trop court (minimum 3 s) »
"""

