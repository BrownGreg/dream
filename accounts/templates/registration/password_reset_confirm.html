{% extends "base.html" %}
{% block content %}
<h1 class="mb-2 text-2xl font-semibold">Nouveau mot de passe</h1>
{% if validlink %}
<form method="post" novalidate class="max-w-md">{% csrf_token %}{% include "partials/form.html" %}{% include "partials/button.html" with label="Enregistrer" %}</form>
{% else %}
<p class="text-slate-300" role="alert">Ce lien n'est plus valable. <a class="underline" href="{% url 'accounts:password_reset' %}">Demander un nouveau lien</a>.</p>
{% endif %}
{% endblock %}
